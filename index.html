<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>周波数判定 & micro:bit連携 (デバッグ表示版)</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
    button { font-size: 16px; padding: 12px; margin: 5px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; }
    button:active { background: #0056b3; }
    .box { background: white; padding: 15px; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    p { font-size: 18px; margin: 8px 0; }
    .highlight { font-weight: bold; color: #d9534f; font-size: 22px; }
  </style>
</head>
<body>

  <h2>音波検知システム (動作確認モード)</h2>
  <button onclick="connectMicrobit()">1. micro:bitと接続</button>
  <button onclick="startAudio()">2. 解析スタート</button>

  <div class="box">
    <p id="status">状態: 未接続</p>
    <p id="percent">現在の周波数割合: 0 %</p>
    <p id="timer" class="highlight">継続時間: 0 秒</p>
    <p id="sendCount">送信履歴: まだ送信していません</p>
  </div>

<script>
  let uardTxCharacteristic;
  const TARGET_FREQ_MIN = 200; // 判定したい周波数下限(Hz)
  const TARGET_FREQ_MAX = 600; // 判定したい周波数上限(Hz)
  const THRESHOLD_PERCENT = 5; // 割合(%)
  const REQUIRED_MINUTES = 0.1; // テスト用に6秒（0.1分）に設定

  let startTime = null;
  let lastDetectedTime = null; // 音を検知した最終時刻
  let sendTotal = 0;
  let isAlerting = false; // 11秒間の重複送信をブロックするフラグ

  // 1. micro:bitへのBluetooth接続処理
  async function connectMicrobit() {
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
      // RX Characteristic (micro:bitへデータ送信口は 6e400002)
      uardTxCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
      
      document.getElementById('status').innerText = "状態: 接続成功！";
    } catch (e) {
      alert("接続失敗: " + e);
    }
  }

  // 2. マイク音声の取得と解析準備
  async function startAudio() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      analyser.fftSize = 2048;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      // 3. 音波のリアルタイム解析ループ
      function analyze() {
        analyser.getByteFrequencyData(dataArray);
        const nyquist = audioCtx.sampleRate / 2;
        const minIdx = Math.round(TARGET_FREQ_MIN / nyquist * bufferLength);
        const maxIdx = Math.round(TARGET_FREQ_MAX / nyquist * bufferLength);

        let targetSum = 0, totalSum = 0;

        for (let i = 0; i < bufferLength; i++) {
          totalSum += dataArray[i];
          if (i >= minIdx && i <= maxIdx) {
            targetSum += dataArray[i];
          }
        }

        let percent = totalSum > 0 ? (targetSum / totalSum) * 100 : 0;

        // 割合をリアルタイム表示
        document.getElementById('percent').innerText = `現在の周波数割合: ${percent.toFixed(1)} % (目標: ${THRESHOLD_PERCENT}%以上)`;

        if (percent >= THRESHOLD_PERCENT) {
          if (startTime === null) startTime = Date.now();
          lastDetectedTime = Date.now(); // 検知時刻を更新

          let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
          document.getElementById('timer').innerText = `継続時間: ${elapsedSec} 秒`;

          // 6秒（0.1分）到達 & 送信ブロック中でなければ実行
          if ((Date.now() - startTime) >= REQUIRED_MINUTES * 60 * 1000 && !isAlerting) {
            isAlerting = true;
            startTime = null; // 重複連打を防ぐため即リセット

            if (uardTxCharacteristic) {
              uardTxCharacteristic.writeValue(new TextEncoder().encode("1\n"))
                .then(() => {
                  sendTotal++;
                  document.getElementById('sendCount').innerText = `送信履歴: ${sendTotal} 回送信しました！ (${new Date().toLocaleTimeString()})`;
                  
                  // 11秒間ブロックを維持
                  setTimeout(() => {
                    isAlerting = false;
                  }, 11000);
                })
                .catch(err => {
                  console.error(err);
                  document.getElementById('sendCount').innerText = `送信エラー: ${err}`;
                  isAlerting = false;
                });
            } else {
              document.getElementById('sendCount').innerText = `エラー: micro:bitと接続されていません`;
              isAlerting = false;
            }
          }
        } else {
          // 音が瞬間的に切れても1秒間(1000ms)はタイマーを維持してリセットを防ぐ
          if (startTime !== null && (Date.now() - lastDetectedTime) > 1000) {
            startTime = null;
            document.getElementById('timer').innerText = `継続時間: 0 秒 (音が検知されていません)`;
          }
        }

        requestAnimationFrame(analyze);
      }

      analyze();
    } catch (e) {
      alert("マイク開始失敗: " + e);
    }
  }
</script>
</body>
</html>
